# 一键启动：docker compose up -d --build
#   - postgres：Flyway 在应用启动时自动建表并写入演示数据（V1~V3）
#   - kafka：KRaft 单节点，9092 供宿主机访问，9094 供 compose 内容器访问
#   - app：监管追踪服务，启动后监听 http://localhost:8080
# 仅起依赖做本地开发：docker compose up -d postgres kafka，然后 mvn spring-boot:run
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: wasteoil
      POSTGRES_PASSWORD: wasteoil123
      POSTGRES_DB: wasteoil
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wasteoil"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:3.8.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,INTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:9094
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 20

  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/wasteoil
      SPRING_DATASOURCE_USERNAME: wasteoil
      SPRING_DATASOURCE_PASSWORD: wasteoil123
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9094
    ports:
      - "8080:8080"

volumes:
  pgdata:
